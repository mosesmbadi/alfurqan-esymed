name: Deploy Afurqan

# Deploys EasyMed to Afurqan Hospital's server. Nothing is built here: the
# server pulls images the easymed repo's CI already published.
#
# Which EasyMed build goes out:
#   - By default, `latest`: the newest build of easymed's main branch. This
#     applies to pushes to main here and to manual runs left blank.
#   - To roll back or pin, run this workflow by hand (Actions -> Deploy
#     Afurqan -> Run workflow) and give a full easymed commit SHA.
#
# Required secrets:   DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER
# Optional:           DEPLOY_DIR, as a variable or a secret. An absolute path, or a
#                     path under the deploy user's home (default: afurqan-deployment).

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      easymed_tag:
        description: "EasyMed image tag (blank = latest). Give a full easymed commit SHA to roll back or pin."
        required: false
        default: ""
        type: string

# One deploy at a time; a newer run waits rather than racing an older one.
concurrency:
  group: deploy-afurqan
  cancel-in-progress: false

env:
  EASYMED_TAG: ${{ inputs.easymed_tag || 'latest' }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR || 'afurqan-deployment' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show EasyMed tag
        run: echo "Deploying EasyMed ${EASYMED_TAG}"

      # Catches YAML mistakes and missing ${...} values before the server is
      # touched. sample.env stands in for the server's .env.
      - name: Validate docker-compose.yml
        run: |
          cp sample.env .env
          docker compose config --quiet

      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e SITE_DOMAIN=lim-alfurqan.proto-typesolutions.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  deploy:
    runs-on: ubuntu-latest
    needs:
      - validate

    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${DEPLOY_SSH_KEY}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      # The heredoc is unquoted so the values above expand here, on the runner;
      # anything meant for the server's shell is escaped (\$).
      - name: Deploy
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << EOF
            set -euo pipefail

            echo "📦 Updating deployment config..."
            # DEPLOY_DIR expands here on the runner; \$HOME on the server.
            case "${DEPLOY_DIR}" in
              /*) DIR="${DEPLOY_DIR}" ;;
              *)  DIR="\$HOME/${DEPLOY_DIR}" ;;
            esac

            # First deploy: clone this repo into DIR. The repo is public, so
            # the server needs no GitHub credentials.
            if [ ! -d "\$DIR/.git" ]; then
              if [ -d "\$DIR" ] && [ -n "\$(ls -A "\$DIR")" ]; then
                echo "\$DIR exists but is not a git clone of this repo. Move its contents aside or point DEPLOY_DIR elsewhere."
                exit 1
              fi
              echo "Cloning ${GITHUB_REPOSITORY} into \$DIR..."
              mkdir -p "\$DIR"
              git clone "https://github.com/${GITHUB_REPOSITORY}.git" "\$DIR"
            fi

            cd "\$DIR"
            git fetch origin
            git reset --hard ${GITHUB_SHA}

            if [ ! -f .env ]; then
              echo "No .env in \$PWD. On the server: cp sample.env .env, fill in every <...>, then re-run this workflow."
              exit 1
            fi

            # Record the tag in .env, so that manual compose commands on the
            # server run the version that is deployed.
            if grep -q '^EASYMED_TAG=' .env; then
              sed -i 's/^EASYMED_TAG=.*/EASYMED_TAG=${EASYMED_TAG}/' .env
            else
              echo 'EASYMED_TAG=${EASYMED_TAG}' >> .env
            fi

            # Pull before touching the running stack: if a pull fails (a tag
            # that was never published, say), the current containers stay up
            # and set -e stops the deploy here.
            echo "⬇️  Pulling EasyMed ${EASYMED_TAG}..."
            docker compose pull

            echo "🚀 Starting containers..."
            docker compose up -d --remove-orphans

            # Images no container uses, older than a week. The week keeps recent
            # versions on disk for a quick rollback; no --volumes, which would
            # put postgres_data and caddy_data (certificates) at risk.
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=168h" || true

            echo "✅ Afurqan is on EasyMed ${EASYMED_TAG}"
          EOF
